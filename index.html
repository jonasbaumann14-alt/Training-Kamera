<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="J.B. Training">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" id="tc" content="#f3f5f3">
<title>J.B. Training</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #f5f7f5;
  --surface: #ffffff;
  --surface-2: #edf1ed;
  --fg: #19221c;
  --muted: #77827a;
  --line: #e3e9e4;

  --accent: #27865b;
  --accent-2: #27865b;
  --on-accent: #ffffff;

  --good: #27865b;
  --warn: #b87922;
  --bad: #d83f43;

  --shadow: 0 2px 5px rgba(25, 40, 29, .025),
            0 8px 28px rgba(25, 40, 29, .055);

  --status: #f5f7f5;
  --nav-bg: rgba(255,255,255,.94);

  --display: "Sora", "Avenir Next", system-ui, -apple-system, sans-serif;
  --body: "Manrope", system-ui, -apple-system, sans-serif;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101512;
    --surface: #191f1b;
    --surface-2: #242d27;
    --fg: #edf3ee;
    --muted: #9aa79e;
    --line: #2b3730;

    --accent: #55b986;
    --accent-2: #55b986;
    --on-accent: #10251a;

    --good: #55b986;
    --warn: #edb75e;
    --bad: #ff7777;

    --shadow: 0 5px 24px rgba(0,0,0,.20);

    --status: #101512;
    --nav-bg: rgba(25,31,27,.94);

    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #101512;
  --surface: #191f1b;
  --surface-2: #242d27;
  --fg: #edf3ee;
  --muted: #9aa79e;
  --line: #2b3730;

  --accent: #55b986;
  --accent-2: #55b986;
  --on-accent: #10251a;

  --good: #55b986;
  --warn: #edb75e;
  --bad: #ff7777;

  --shadow: 0 5px 24px rgba(0,0,0,.20);

  --status: #101512;
  --nav-bg: rgba(25,31,27,.94);

  color-scheme: dark;
}

/* Grundlayout */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  overscroll-behavior-x: none;
}

body {
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top, 0)
    max(18px, env(safe-area-inset-right, 0px))
    0
    max(18px, env(safe-area-inset-left, 0px));
}

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--status);
  z-index: 20;
}

h1,
h2,
h3 {
  font-family: var(--display);
  font-weight: 700;
  letter-spacing: -.035em;
  margin: 0;
  text-wrap: balance;
}

button,
input,
textarea {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-appearance: none;
  touch-action: manipulation;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}

[hidden] {
  display: none !important;
}

.label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .095em;
  text-transform: uppercase;
  color: var(--muted);
}

.num {
  font-variant-numeric: tabular-nums;
}

.wrap {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 22px;
  padding-block: 25px 32px;
  min-width: 0;
}

.muted {
  color: var(--muted);
}

/* Buttons */

.primary {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 58px;
  background: var(--accent);
  color: var(--on-accent);
  font-family: var(--display);
  font-weight: 700;
  font-size: 17px;
  padding: 16px 22px;
  border-radius: 18px;
  width: 100%;
  box-shadow: 0 5px 14px color-mix(in srgb, var(--accent) 20%, transparent);
  transition: transform .15s ease, filter .15s ease;
}

.primary:active {
  transform: scale(.98);
  filter: brightness(.95);
}

.primary[disabled] {
  opacity: .35;
  cursor: default;
  box-shadow: none;
}

.ghost {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 54px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 14px 18px;
  font-weight: 700;
  font-size: 15px;
  width: 100%;
  box-shadow: var(--shadow);
  transition: transform .15s ease, border-color .15s ease;
}

.ghost:active {
  transform: scale(.985);
}

.ghost.danger {
  color: var(--bad);
}

/* Karten */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 25px;
  padding: 22px;
  box-shadow: var(--shadow);
}

.top h1 {
  font-size: 30px;
  line-height: 1.2;
}

.top p {
  color: var(--muted);
  margin: 7px 0 0;
  font-size: 14px;
}

.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 4px 0;
}

.hero h1 {
  font-size: clamp(25px, 7vw, 32px);
  line-height: 1.2;
}

.hero p {
  color: var(--muted);
  margin: 7px 0 0;
  font-size: 14px;
}

.iconbtn {
  flex: none;
  width: 48px;
  height: 48px;
  border-radius: 17px;
  background: var(--surface);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  box-shadow: var(--shadow);
}

.iconbtn:active {
  transform: scale(.95);
}

.iconbtn svg,
#nav svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Untere Navigation */

#home {
  padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
}

#nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: min(440px, calc(100% - 28px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));

  background: var(--nav-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,.12);

  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 3px;
  padding: 7px;
  z-index: 4;
}

#nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 58px;
  padding: 6px 1px;
  border-radius: 17px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: -.01em;
  color: var(--muted);
  transition: background .2s ease, color .2s ease;
}

#nav button svg {
  width: 21px;
  height: 21px;
}

#nav button[aria-current="true"] {
  background: color-mix(in srgb, var(--accent) 13%, transparent);
  color: var(--accent);
}

/* Rang und Woche */

.rank {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 9px 12px;
  align-items: end;
  padding: 23px;
}

.rank h2 {
  font-size: 35px;
  line-height: 1.15;
  color: var(--accent);
  margin-top: 4px;
}

.rank .pts {
  font-family: var(--display);
  font-weight: 700;
  font-size: 30px;
  line-height: 1.1;
  text-align: right;
}

.bar {
  grid-column: 1 / -1;
  height: 9px;
  background: var(--surface-2);
  border-radius: 20px;
  overflow: hidden;
  margin-top: 8px;
}

.bar i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 20px;
  transition: width .4s ease;
}

.rank small {
  grid-column: 1 / -1;
  color: var(--muted);
  font-size: 12px;
}

.weekcard {
  display: flex;
  flex-direction: column;
  gap: 19px;
}

.wk {
  display: flex;
  align-items: center;
  gap: 18px;
}

.ring {
  position: relative;
  width: 76px;
  height: 76px;
  flex: none;
}

.ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.ring circle {
  fill: none;
  stroke-width: 8;
}

.ring .bg {
  stroke: var(--surface-2);
}

.ring .fg {
  stroke: var(--accent);
  stroke-linecap: round;
}

.ring b {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-size: 20px;
}

.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 7px;
}

.day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
}

.dot {
  width: 100%;
  max-width: 38px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 14px;
}

.dot.plan {
  background: transparent;
  border: 2px dashed var(--accent);
}

.dot.done {
  background: var(--accent);
  color: var(--on-accent);
  border: 0;
}

.dot.today {
  box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--fg);
}

/* Heute und Übungen */

.today h2 {
  font-size: 34px;
  line-height: 1.15;
  margin-top: 5px;
}

.today .sub {
  color: var(--muted);
  margin: 8px 0 19px;
  font-size: 14px;
}

.ex {
  list-style: none;
  margin: 0 0 20px;
  padding: 0;
}

.ex li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-top: 1px solid var(--line);
  font-size: 14px;
}

.ex li:first-child {
  border-top: 0;
}

.ex b {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 700;
}

.list {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.item {
  text-align: left;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 21px;
  padding: 18px;
  box-shadow: var(--shadow);
  transition: border-color .15s ease, transform .15s ease;
}

.item:active {
  transform: scale(.99);
}

.item:hover {
  border-color: var(--accent);
}

.item.off {
  background: transparent;
  border-style: dashed;
  box-shadow: none;
  cursor: default;
}

.item.off:hover {
  border-color: var(--line);
}

.item h3 {
  font-size: 18px;
  line-height: 1.3;
}

.item p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.item .go {
  grid-row: 1 / span 2;
  grid-column: 2;
  font-weight: 800;
  font-size: 13px;
  color: var(--accent);
  white-space: nowrap;
}

.item .go.ok {
  color: var(--good);
}

/* Statistiken */

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px 8px;
}

.stat {
  min-width: 0;
}

.stat b {
  font-family: var(--display);
  font-size: clamp(20px, 6vw, 26px);
  line-height: 1.2;
  font-weight: 700;
  display: block;
  overflow-wrap: anywhere;
}

.stat span {
  font-size: 10px;
  line-height: 1.4;
}

.badges {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}

.badge {
  border: 1px solid var(--line);
  border-radius: 19px;
  padding: 15px;
  font-size: 13px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.badge b {
  display: block;
  font-size: 15px;
  font-family: var(--display);
  font-weight: 700;
  margin-bottom: 4px;
}

.badge.locked {
  opacity: .45;
  box-shadow: none;
}

.note {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.err {
  background: color-mix(in srgb, var(--bad) 13%, var(--surface));
  border: 1px solid var(--bad);
  border-radius: 19px;
  padding: 18px;
  color: var(--fg);
  font-size: 16px;
  font-weight: 700;
  line-height: 1.55;
}

.hist {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 21px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.hist > div {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 15px 17px;
  border-top: 1px solid var(--line);
  font-size: 13px;
}

.hist > div:first-child {
  border-top: 0;
}

.hist small {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-top: 3px;
}

.lv {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}

.lv b {
  font-family: var(--display);
  font-size: 15px;
  font-weight: 700;
  text-align: right;
}

.bars {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 7px;
  align-items: end;
  height: 130px;
}

.bars div {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  height: 100%;
  gap: 5px;
  font-size: 10px;
  color: var(--muted);
  min-width: 0;
}

.bars i {
  display: block;
  width: 100%;
  background: var(--surface-2);
  border-radius: 8px 8px 4px 4px;
  min-height: 4px;
}

.bars div.cur i,
.bars div.hit i {
  background: var(--accent);
}

.bars div.today > span:last-child {
  color: var(--fg);
  font-weight: 800;
}

/* Eingabefelder */

textarea,
input[type="text"],
input[type="email"],
input[type="password"],
input[type="number"] {
  width: 100%;
  min-height: 53px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 16px;
  color: var(--fg);
  font-size: 15px;
  outline-offset: 2px;
  transition: border-color .15s ease, background .15s ease;
}

textarea:focus,
input:focus {
  border-color: var(--accent);
}

textarea::placeholder,
input::placeholder {
  color: var(--muted);
  opacity: .8;
}

textarea {
  min-height: 100px;
  resize: vertical;
  font-size: 14px;
}

.seg {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  background: var(--surface-2);
  padding: 5px;
  border-radius: 16px;
}

.seg button {
  min-height: 42px;
  padding: 9px 5px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 13px;
  color: var(--muted);
}

.seg button.sel {
  background: var(--surface);
  color: var(--accent);
  box-shadow: var(--shadow);
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.pill {
  min-width: 48px;
  min-height: 42px;
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 15px;
  background: var(--surface-2);
  color: var(--fg);
}

.pill:active {
  transform: scale(.94);
}

.pill.on {
  background: var(--accent);
  color: var(--on-accent);
}

/* Aktivität und Konto */

.ring.big {
  width: 140px;
  height: 140px;
}

.ring.big circle {
  stroke-width: 12;
}

.ring.big b {
  flex-direction: column;
  font-size: 27px;
  line-height: 1.1;
  text-align: center;
}

.ring.big b small {
  font-family: var(--body);
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}

.bars.seven {
  grid-template-columns: repeat(7, 1fr);
}

.seg.two {
  grid-template-columns: repeat(2, 1fr);
}

.spin2 {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 4px solid var(--surface-2);
  border-top-color: var(--accent);
  animation: sp 1s linear infinite;
}

.stepinfo {
  display: flex;
  align-items: center;
  gap: 18px;
}

.stepinfo b {
  font-family: var(--display);
  font-size: 19px;
  line-height: 1.4;
  display: block;
  overflow-wrap: anywhere;
}

/* Rangliste und Admin */

.lb > div.me {
  background: color-mix(in srgb, var(--accent) 11%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
}

.lb > div {
  align-items: center;
}

.lbn {
  display: inline-block;
  width: 32px;
  color: var(--muted);
  font-family: var(--display);
  font-size: 18px;
  font-weight: 700;
}

.lb > div:nth-child(-n+3) .lbn {
  color: var(--accent);
}

.admrow {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 16px;
  border-top: 1px solid var(--line);
}

.admrow:first-child {
  border-top: 0;
}

.admrow .btns {
  display: flex;
  gap: 8px;
}

.admrow .btns button {
  flex: 1;
  min-height: 43px;
  padding: 10px 6px;
  border-radius: 13px;
  border: 1px solid var(--line);
  font-weight: 700;
  font-size: 13px;
  background: var(--surface-2);
}

.admrow .btns .danger {
  color: var(--bad);
}

.tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--bad) 14%, var(--surface));
  color: var(--bad);
  margin-left: 6px;
}

/* Einrichtung und Onboarding */

.dots {
  display: flex;
  gap: 5px;
}

.dots i {
  flex: 1;
  height: 5px;
  border-radius: 5px;
  background: var(--surface-2);
}

.dots i.on {
  background: var(--accent);
}

.onb h1 {
  font-size: 32px;
  line-height: 1.2;
}

.opts {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.opt {
  text-align: left;
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 18px;
  box-shadow: var(--shadow);
  transition: border-color .15s ease, background .15s ease, transform .15s ease;
}

.opt:active {
  transform: scale(.99);
}

.opt b {
  display: block;
  font-size: 17px;
  font-family: var(--display);
  font-weight: 700;
}

.opt span {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.opt.sel {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 9%, var(--surface));
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.chip {
  min-height: 45px;
  padding: 10px 18px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  font-weight: 700;
  font-size: 14px;
  background: var(--surface);
  color: var(--fg);
  transition: border-color .15s ease, background .15s ease;
}

.chip.sel {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--surface));
  color: var(--accent);
}

.backbtn {
  color: var(--muted);
  font-weight: 700;
  padding: 8px 0;
  align-self: flex-start;
}

/* Kamera-Training: konsequent dunkle Oberfläche */

#work {
  position: fixed;
  inset: 0;
  background: #080b09;
  color: #fff;
  display: flex;
  flex-direction: column;
  z-index: 30;
  padding: env(safe-area-inset-top, 0)
    env(safe-area-inset-right, 0)
    env(safe-area-inset-bottom, 0)
    env(safe-area-inset-left, 0);
}

.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: #080b09;
}

.stage video,
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

.hud-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 17px 19px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.82),
    rgba(0,0,0,.30),
    transparent
  );
}

.hud-top h2 {
  font-size: 21px;
  color: #fff;
  text-shadow: 0 2px 8px #000;
}

.hud-top .label {
  color: #ffffffd9;
  font-size: 11px;
  text-shadow: 0 1px 5px #000;
}

.steps {
  display: flex;
  gap: 4px;
  padding: 0 18px;
  position: absolute;
  top: 64px;
  left: 0;
  right: 0;
}

.steps i {
  flex: 1;
  height: 5px;
  border-radius: 5px;
  background: #ffffff45;
}

.steps i.on {
  background: #55c78b;
}

.steps i.cur {
  background: #fff;
}

.hud-mid {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  pointer-events: none;
}

.count {

  font-weight: 800;
  font-size: clamp(96px, 30vw, 150px);
  line-height: .95;
  color: #fff;
  text-shadow: 0 3px 25px #000c;
}

.count small {
  font-size: .3em;
  color: #ffffffd0;
  margin-left: 6px;
}

.fb {
  background: rgba(0,0,0,.78);
  border: 1px solid #ffffff30;
  color: #fff;
  padding: 10px 19px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 15px;
  text-align: center;
  max-width: calc(100% - 32px);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  text-shadow: 0 1px 3px #000;
}

.fb.good {
  color: #65dda0;
}

.fb.warn {
  color: #ffd078;
}

.fb.bad {
  color: #ff8888;
}

/* Große Kamera-Fehlermeldungen */

#bigfb {
  position: absolute;
  left: 15px;
  right: 15px;
  top: 105px;
  text-align: center;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(29px, 8.5vw, 48px);
  line-height: 1.16;
  letter-spacing: -.035em;
  color: #fff;
  background: #c93434;
  border: 1px solid rgba(255,255,255,.2);
  padding: 20px 18px;
  border-radius: 23px;
  box-shadow: 0 12px 40px rgba(0,0,0,.55);
  animation: shake .35s;
  pointer-events: none;
  overflow-wrap: anywhere;
  text-shadow: 0 2px 5px rgba(0,0,0,.3);
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-9px); }
  40% { transform: translateX(9px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

/* Kamera-Steuerung */

.ctrl {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
  padding: 12px 15px 15px;
  background: #080b09;
}

.ctrl button {
  min-height: 55px;
  padding: 13px 4px;
  border-radius: 16px;
  background: #202923;
  border: 1px solid #ffffff16;
  color: #fff;
  font-weight: 800;
  font-size: 14px;
  transition: background .15s ease, transform .15s ease;
}

.ctrl button:active {
  background: #344239;
  transform: scale(.96);
}

.ctrl .stop {
  color: #ff8585;
  background: #30201f;
}

/* Kamera-Overlays */

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  overflow: auto;
  text-align: center;
  background: rgba(0,0,0,.88);
  color: #fff;
  padding: 26px 22px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.overlay > div {
  margin: auto;
  max-width: 360px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
}

.demo {
  width: 100%;
  max-width: 300px;
  aspect-ratio: 3 / 2;
  height: auto;
  border-radius: 20px;
  background: #ffffff14;
  border: 1px solid #ffffff25;
  touch-action: none;
  cursor: grab;
}

.demotip {
  font-size: 14px;
  line-height: 1.6;
  color: #e1e8e3;
  margin: 0;
}

.overlay h2 {
  font-size: 30px;
  line-height: 1.2;
  color: #fff;
}

.overlay p {
  font-size: 15px;
  line-height: 1.6;
  color: #e2e9e4;
}

.overlay .primary {
  color: #10251a;
  background: #62ce91;
  min-height: 56px;
}

.overlay .ghost {
  color: #17211b;
  background: #fff;
  border: 0;
}

.restn {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(82px, 25vw, 110px);
  line-height: 1;
  color: #65d497;
  font-variant-numeric: tabular-nums;
}

.spin {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 4px solid #ffffff30;
  border-top-color: #65d497;
  animation: sp 1s linear infinite;
}

@keyframes sp {
  to { transform: rotate(360deg); }
}

/* Abschluss */

.done h2 {
  font-size: 48px;
  line-height: 1.1;
  color: var(--accent);
}

.sum {
  display: flex;
  gap: 26px;
  flex-wrap: wrap;
}

.sum b {
  font-family: var(--display);
  font-size: 33px;
  font-weight: 700;
  line-height: 1.2;
  display: block;
}

.fbk {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.fbk button {
  min-height: 52px;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 5px;
  font-weight: 700;
  font-size: 13px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.fbk button:active {
  transform: scale(.97);
}

/* Kleine Displays */

@media (max-width: 380px) {
  body {
    padding-left: 14px;
    padding-right: 14px;
  }

  .wrap {
    gap: 18px;
  }

  .card {
    padding: 18px;
    border-radius: 22px;
  }

  .stats {
    gap: 9px 5px;
  }

  .stat b {
    font-size: 21px;
  }

  .stat span {
    font-size: 9px;
  }

  .stepinfo {
    gap: 12px;
  }

  .ring.big {
    width: 112px;
    height: 112px;
  }

  #nav {
    width: calc(100% - 20px);
  }

  #nav button {
    font-size: 9px;
  }

  .ctrl {
    gap: 6px;
    padding-left: 10px;
    padding-right: 10px;
  }

  .ctrl button {
    font-size: 12px;
  }
}

/* Bewegung reduzieren */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }

  #bigfb {
    animation: none;
  }
}

/* ================= Statistik ================= */
function stats() {
  const byEx = {}; KEYS.forEach(k => byEx[k] = 0);
  let pts = 0, reps = 0, bestPlank = 0;
  DB.sessions.forEach(s => {
    pts += s.pts || 0;
    for (const k in (s.res || {})) {
      if (!EX[k]) continue;
      if (EX[k].hold) { if (k === 'plank') bestPlank = Math.max(bestPlank, s.res[k]); } else reps += s.res[k];
      byEx[k] += s.res[k];
    }
  });
  const days = new Set(DB.sessions.map(s => s.d));
  const d = new Date(); let streak = 0;
  if (!days.has(dkey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dkey(d))) { streak++; d.setDate(d.getDate() - 1); }
  const wk = dkey(monOf(new Date()));
  const weekCount = new Set(DB.sessions.filter(s => s.d >= wk).map(s => s.d)).size;
  const weekDone = !!DB.profile && weekCount >= DB.profile.days.length;
  let goalDays = 0; for (const k in DB.steps) if (DB.steps[k] >= DB.settings.stepGoal) goalDays++;
  return { pts, reps, byEx, bestPlank, streak, sessions: DB.sessions.length, days, weekCount, weekDone, goalDays };
}
function checkAch() {
  const st = stats(), fresh = [];
  ACH.forEach(a => { if (DB.got.indexOf(a[0]) < 0 && a[3](st)) { DB.got.push(a[0]); fresh.push(a); } });
  return fresh;
}
function rankInfo(pts) {
  let ri = 0; RANKS.forEach((r, i) => { if (pts >= r[1]) ri = i; });
  const next = RANKS[ri + 1];
  return { name: RANKS[ri][0], next, pct: next ? Math.round((pts - RANKS[ri][1]) / (next[1] - RANKS[ri][1]) * 100) : 100 };
}

/* ================= Plan-Erzeugung ================= */
function planTypes(p) {
  const n = p.days.length;
  const tpl = { 2: ['full','full'], 3: ['full','full','full'], 4: ['upper','lower','core','full'], 5: ['upper','lower','core','upper','lower'],
    6: ['upper','lower','core','upper','lower','full'], 7: ['upper','lower','core','upper','lower','core','full'] }[n] || ['full'];
  if (p.goal === 'fat') return tpl.map(() => 'full');
  if (p.goal === 'core') return tpl.map((t, i) => (t === 'full' || t === 'upper') && i % 2 === 0 ? 'core' : t);
  return tpl;
}
const typeForDay = (p, dow) => { const i = p.days.indexOf(dow); return i < 0 ? null : planTypes(p)[i]; };

function poolFor(type, p) {
  let ex = TYPES[type].filter(k => !p.limits.some(l => LIM[l] && LIM[l].indexOf(k) >= 0));
  if (ex.length < 2) ['bridge', 'plank'].forEach(k => { if (ex.indexOf(k) < 0) ex.push(k); });
  return ex;
}
function targetFor(k, p) {
  const c = p.cap[k], f = GOAL[p.goal].f;
  return EX[k].hold ? Math.max(10, Math.round(c * f / 5) * 5) : Math.max(3, Math.round(c * f));
}
function buildSession(type) {
  const p = DB.profile, g = GOAL[p.goal];
  const pool = poolFor(type, p);
  const n = Math.min(pool.length, p.minutes <= 15 ? 3 : p.minutes <= 25 ? 4 : 5);
  const off = DB.sessions.length % pool.length;
  const ex = []; for (let i = 0; i < n; i++) ex.push(pool[(off + i) % pool.length]);
  const sets = ex.map(() => 0);
  const budget = p.minutes * 60 - 60; let time = 0, i = 0;
  for (let guard = 0; guard < 60; guard++) {
    const idx = i % ex.length, k = ex[idx], t = targetFor(k, p);
    const dur = (EX[k].hold ? t : t * 3.5) + g.rest;
    if (time + dur > budget && sets.every(s => s > 0)) break;
    sets[idx]++; time += dur; i++;
  }
  const steps = [];
  ex.forEach((k, idx) => { for (let s = 0; s < sets[idx]; s++) steps.push([k, targetFor(k, p)]); });
  return { type, steps, rest: g.rest };
}
function summarize(steps) {
  const out = [];
  steps.forEach(s => { const l = out[out.length - 1]; if (l && l.k === s[0]) l.sets++; else out.push({ k: s[0], sets: 1, t: s[1] }); });
  return out;
}
function adjust(k, mult) {
  const c = DB.profile.cap[k]; let n = c * mult;
  if (mult > 1 && n - c < 1) n = c + 1;
  if (mult < 1 && c - n < 1) n = c - 1;
  DB.profile.cap[k] = Math.round(Math.max(EX[k].hold ? 10 : 3, n) * 10) / 10;
}

const POSE_LINES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function angle(a, b, c, w, h) {
  const v1 = [(a.x - b.x) * w, (a.y - b.y) * h], v2 = [(c.x - b.x) * w, (c.y - b.y) * h];
  const dot = v1[0]*v2[0] + v1[1]*v2[1], m = Math.hypot(v1[0], v1[1]) * Math.hypot(v2[0], v2[1]);
  if (!m) return null;
  return Math.acos(Math.max(-1, Math.min(1, dot / m))) * 180 / Math.PI;
}
function angle3(a, b, c) {
  const v1 = [a.x - b.x, a.y - b.y, a.z - b.z], v2 = [c.x - b.x, c.y - b.y, c.z - b.z];
  const dot = v1[0]*v2[0] + v1[1]*v2[1] + v1[2]*v2[2], m = Math.hypot(...v1) * Math.hypot(...v2);
  if (!m) return null;
  return Math.acos(Math.max(-1, Math.min(1, dot / m))) * 180 / Math.PI;
}
function measure(lm, joints, w, h, wl) {
  const vals = [];
  for (const j of joints) {
    const p = j.map(i => lm[i]);
    if (Math.min(...p.map(q => q.visibility ?? 0)) < 0.5) continue;
    const a = wl ? angle3(wl[j[0]], wl[j[1]], wl[j[2]]) : angle(p[0], p[1], p[2], w, h);
    if (a !== null) vals.push(a);
  }
  return vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : null;
}

}
function myPlace() {
  if (!lbCache) return lbErr ? 'Nicht erreichbar' : 'Wird geladen …';
  const rows = lbRows('all'), i = rows.findIndex(r => cu && r.id === cu.uid);
  return i < 0 ? 'Noch nicht platziert' : 'Platz ' + (i + 1) + ' von ' + rows.length;
}
function drawLb() {
  if (!cloud || !cu) { $('v-lb').innerHTML = '<button class="backbtn" data-tab="today">← Zurück</button><div class="card muted">Die Rangliste gibt es mit einem Konto.</div>'; return; }
  const rows = lbRows(lbPeriod), hidden = DB.settings.showLb === false;
  $('v-lb').innerHTML =
    '<button class="backbtn" data-tab="today">← Zurück</button>' +
    '<div class="top"><h1>Rangliste</h1><p>Alle Nutzer von J.B. Training</p></div>' +
    '<div class="seg two"><button data-lbp="all" class="' + (lbPeriod === 'all' ? 'sel' : '') + '">Gesamt</button><button data-lbp="week" class="' + (lbPeriod === 'week' ? 'sel' : '') + '">Diese Woche</button></div>' +
    (lbErr ? '<div class="err">' + esc(lbErr) + '</div>' : '') +
    (hidden ? '<p class="note">Du bist in der Rangliste ausgeblendet. Du kannst das unter Profil ändern.</p>' : '') +
    (rows.length ? '<div class="hist lb">' + rows.map((r, i) => {
      const me = cu && r.id === cu.uid;
      return '<div class="' + (me ? 'me' : '') + '"><span style="display:flex;gap:10px;align-items:center;min-width:0"><b class="lbn num">' + (i + 1) + '</b><span style="min-width:0"><b>' + esc(r.name) + (me ? ' (du)' : '') + '</b><small>' + rankInfo(r.pts || 0).name + ' · ' + (r.sessions || 0) + ' Einheiten</small></span></span><span class="num"><b>' + fmt(r.v) + '</b> P</span></div>';
    }).join('') + '</div>' : '<div class="card muted">Noch keine Einträge' + (lbPeriod === 'week' ? ' in dieser Woche' : '') + '. Schließe ein Training ab, um Punkte zu sammeln.</div>') +
    '<p class="note">Die Punkte berechnet die App auf dem Gerät. Andere sehen deinen Anzeigenamen, deine Punkte und Einheiten, nicht deine E-Mail-Adresse.</p>';
}
function renderLb() { drawLb(); refreshLb().then(() => { if (tab === 'lb') drawLb(); }); }
function lbSettings() {
  if (!cloud || !cu) return '';
  const on = DB.settings.showLb !== false;
  return '<div><div class="label" style="margin-bottom:10px">Rangliste</div><div class="card" style="display:flex;flex-direction:column;gap:12px">' +
    '<div class="row"><span>In der Rangliste zeigen</span><button class="pill' + (on ? ' on' : '') + '" data-act="showlb">' + (on ? 'An' : 'Aus') + '</button></div>' +
    '<input type="text" id="nm-in" maxlength="20" autocomplete="nickname" aria-label="Anzeigename" value="' + esc(DB.profile.name) + '">' +
    '<button class="ghost" data-act="name">Anzeigename speichern</button>' +
    '<p class="note" style="margin:0">Andere sehen deinen Anzeigenamen, deine Punkte und Einheiten. Deine E-Mail-Adresse bleibt privat.</p></div></div>';
}

/* ================= Sicherung ================= */
function exportCode() { return btoa(unescape(encodeURIComponent(JSON.stringify(DB)))); }
function importCode(c) {
  const o = JSON.parse(decodeURIComponent(escape(atob(c.trim()))));
  if (!o || !Array.isArray(o.sessions) || !o.profile || !o.profile.cap || !o.profile.days) throw new Error('bad');
  DB = normDB(o);
  applyTheme();
}

/* ================= Ereignisse ================= */
let wipeArmed = false;
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { setTab(d.tab); return; }
  if (d.start) { begin(buildSession(d.start)); return; }
  if (d.free) { begin({ type: 'free', steps: [[d.free, targetFor(d.free, DB.profile)]], rest: 30 }); return; }
  if (d.fbk) {
    const m = { easy: 1.07, ok: 1, hard: 0.93 }[d.fbk];
    if (m !== 1) lastDoneKeys.forEach(k => adjust(k, m));
    save(); renderAll(); lastDoneKeys = [];
    const w = $('fbwrap'); if (w) w.innerHTML = '<p class="muted">Danke, das Ergebnis ist gespeichert. Dein nächstes Training passt sich an.</p>';
    return;
  }
  if (d.ob) {
    if (d.ob === 'next') obNext();
    else if (d.ob === 'back') { ob.i = Math.max(0, ob.i - 1); renderOnb(); }
    else if (d.ob === 'cancel') { showScreen('home'); }
    else if (d.ob === 'goal') { ob.goal = d.v; obNext(); }
    else if (d.ob === 'lv') { ob.lv[d.k] = Number(d.v); obNext(); }
    else if (d.ob === 'min') { ob.minutes = Number(d.v); obNext(); }
    else if (d.ob === 'lim') { const i = ob.limits.indexOf(d.v); if (i < 0) ob.limits.push(d.v); else ob.limits.splice(i, 1); renderOnb(); }
    else if (d.ob === 'day') { const n = Number(d.v), i = ob.days.indexOf(n); if (i < 0) ob.days.push(n); else ob.days.splice(i, 1); renderOnb(); }
    else if (d.ob === 'finish') { DB.profile = makeProfile(); save(); renderAll(); setTab('today'); showScreen('home'); }
    return;
  }
  if (d.sday) { actState.day = d.sday; renderAct(); return; }
  if (d.auth) {
    if (d.auth === 'reset') resetPw(); else { authMode = d.auth; authMsg = ''; renderAuth(); }
    return;
  }
  if (d.lbp) { lbPeriod = d.lbp; drawLb(); return; }
  if (d.mdel !== undefined) {
    const i = Number(d.mdel);
    if (musicArm !== i) { musicArm = i; renderMusic(); return; }
    DB.music.splice(i, 1); musicArm = -1; musicMsg = ''; save(); renderMusic(); renderToday(); return;
  }
  if (d.admban) { admAct('ban', d.admban, t); return; }
  if (d.admdel) {
    if (d.armed !== '1') { d.armed = '1'; t.textContent = 'Sicher? Nochmal tippen'; return; }
    admAct('del', d.admdel, t); return;
  }
  if (d.themeSet) { DB.settings.theme = d.themeSet; save(); applyTheme(); renderAll(); return; }
  if (d.act) {
    if (d.act === 'musave') addMusic();
    else if (d.act === 'redo') startOnboarding();
    else if (d.act === 'stepsave') {
      const v = parseInt($('st-in').value, 10);
      if (isNaN(v) || v < 0 || v > 100000) { $('stmsg').textContent = 'Gib eine Zahl zwischen 0 und 100 000 ein.'; return; }
      DB.steps[actState.day === 'yesterday' ? dayKey(1) : dayKey(0)] = v;
      const fresh = checkAch();
      actMsg = 'Gespeichert.' + (fresh.length ? ' Neuer Erfolg: ' + fresh.map(a => a[1]).join(', ') + '.' : '');
      save(); renderAll();
    }
    else if (d.act === 'goal-') { DB.settings.stepGoal = Math.max(2000, DB.settings.stepGoal - 1000); save(); renderAll(); }
    else if (d.act === 'goal+') { DB.settings.stepGoal = Math.min(30000, DB.settings.stepGoal + 1000); save(); renderAll(); }
    else if (d.act === 'logout') logout();
    else if (d.act === 'showlb') { DB.settings.showLb = DB.settings.showLb === false; save(); renderMe(); }
    else if (d.act === 'name') { const v = $('nm-in').value.trim().slice(0, 20); if (v) { DB.profile.name = v; save(); renderAll(); } }
    else if (d.act === 'retry') location.reload();
    else if (d.act === 'adminload') loadUsers();
    else if (d.act === 'resend') { cloud.authM.sendEmailVerification(cloud.auth.currentUser).then(() => { $('admmsg').textContent = 'Mail gesendet.'; }, e => { $('admmsg').textContent = authErr(e); }); }
    else if (d.act === 'verified') {
      cloud.auth.currentUser.reload().then(() => cloud.auth.currentUser.getIdToken(true)).then(() => { cu = cloud.auth.currentUser; renderMe(); }, e => { $('admmsg').textContent = authErr(e); });
    }
    else if (d.act === 'delacc1') { t.textContent = 'Wirklich löschen? Nochmal tippen'; d.act = 'delacc2'; }
    else if (d.act === 'delacc2') deleteAccount($('del-pw').value);
    else if (d.act === 'theme') { DB.settings.theme = isDark() ? 'light' : 'dark'; save(); applyTheme(); renderAll(); }
    else if (d.act === 'sound') { DB.settings.sound = !DB.settings.sound; save(); renderMe(); }
    else if (d.act === 'voice') { DB.settings.voice = !DB.settings.voice; save(); renderMe(); }
    else if (d.act === 'export') { const b = $('bk'); b.value = exportCode(); b.select(); $('bkmsg').textContent = 'Code erzeugt. Kopiere ihn und bewahre ihn sicher auf.'; }
    else if (d.act === 'copy') {
      const b = $('bk'); if (!b.value) b.value = exportCode();
      b.select();
      try { navigator.clipboard.writeText(b.value).then(() => { $('bkmsg').textContent = 'Kopiert.'; }, () => { $('bkmsg').textContent = 'Markiert. Kopiere den Code von Hand.'; }); }
      catch (err) { $('bkmsg').textContent = 'Markiert. Kopiere den Code von Hand.'; }
    }
    else if (d.act === 'import') {
      const v = $('bk').value.trim();
      if (!v) { $('bkmsg').textContent = 'Füge zuerst einen Sicherungscode in das Feld ein.'; return; }
      try { importCode(v); save(); renderAll(); meMsg = 'Wiederhergestellt.'; renderMe(); }
      catch (err) { $('bkmsg').textContent = 'Der Code ist ungültig. Kopiere ihn vollständig.'; }
    }
    else if (d.act === 'wipe1') { wipeArmed = true; t.textContent = 'Wirklich alles löschen? Nochmal tippen'; d.act = 'wipe2'; }
    else if (d.act === 'wipe2') {
      try { localStorage.removeItem(KEY); localStorage.removeItem('ht-kamera'); } catch (err) {}
      DB = normDB({ settings: DB.settings }); save(); startOnboarding();
    }
    return;
  }
  if (t.id === 'ov-go') { overlay(''); startStep(0); beep(660, .15); return; }
  if (t.id === 'ov-back') { closeCamera(); run = null; showScreen('home'); return; }
  if (t.id === 'rest-skip') { endRest(); return; }
  if (t.id === 'plus') { addRep(1); return; }
  if (t.id === 'minus') { addRep(-1); return; }
  if (t.id === 'skip') { if (run && !run.lock) next(); return; }
  if (t.id === 'stop') { finish(false); return; }
  if (t.id === 'home-btn') { renderAll(); setTab('today'); showScreen('home'); }
});

/* ================= Symbol für den Home-Bildschirm ================= */
function makeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const g = c.getContext('2d');
    g.fillStyle = '#0c110e'; g.fillRect(0, 0, 180, 180);
    g.fillStyle = '#4cc38a'; g.font = '800 104px "Barlow Condensed", "Arial Narrow", Arial, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('JB', 90, 96);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch (e) {}
}
try { (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(makeIcon); } catch (e) { makeIcon(); }

/* ================= Start ================= */
if (!window.isSecureContext || !navigator.mediaDevices) showWarn('Die Kamera funktioniert nur, wenn diese Seite über HTTPS geöffnet wird, nicht als lokale Datei.');
function startLocal() { if (DB.profile) { renderAll(); setTab('today'); showScreen('home'); } else startOnboarding(); }
document.addEventListener('submit', e => { if (e.target.id === 'auth-form') { e.preventDefault(); doAuth(); } });
document.addEventListener('visibilitychange', () => {
  if (!cloud || !cu) return;
  if (document.visibilityState === 'hidden') { if (canPush && dirty) pushNow(); } else syncPull();
});
window.addEventListener('online', () => syncPull());
(async function boot() {
  const c = await Promise.race([initCloud(), new Promise(r => setTimeout(() => r({ status: 'fail' }), 8000))]);
  if (c.status !== 'ok') {
    if (c.status === 'fail' && !DB.profile) { bootError('Keine Verbindung zum Konto-Dienst. Prüfe dein Internet und versuche es erneut.'); return; }
    startLocal(); return;
  }
  cloud = c;
  cloud.authM.onAuthStateChanged(cloud.auth, async u => {
    if (u) { cu = u; wasIn = true; await afterLogin(); }
    else { if (wasIn) { wipeLocal(); wasIn = false; } cu = null; showAuth(); }
  });
})();
</script>
</body>
